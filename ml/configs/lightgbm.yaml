# LightGBM default hyperparameters for CSE-CIC-IDS2018
# 14 attack classes + 1 Benign = 15 classes

objective: multiclass
metric: multi_logloss
num_class: 15
learning_rate: 0.05
num_leaves: 127
max_depth: -1
min_child_samples: 50
subsample: 0.8
colsample_bytree: 0.8
n_estimators: 500
is_unbalance: true
verbosity: -1
random_state: 42
