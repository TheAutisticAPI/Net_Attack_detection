[project]
name = "nids-ml"
version = "0.1.0"
description = "Machine Learning track for TheAutisticNIDS – Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "xgboost>=2.0,<3",
    "shap>=0.45,<1",
    "mlflow>=2.14,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
