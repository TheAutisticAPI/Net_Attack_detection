services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: nids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nids_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nids}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nids}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MLflow Tracking Server
  # ============================================
  mlflow:
    image: python:3.12-slim
    container_name: nids-mlflow
    restart: unless-stopped
    command: >
      bash -c "pip install mlflow==2.18.0 --quiet &&
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # FastAPI Backend
  # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nids-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nids}:${POSTGRES_PASSWORD:-nids_dev_password}@postgres:5432/${POSTGRES_DB:-nids}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_DEBUG: "true"
      API_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Next.js Dashboard
  # ============================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nids-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  mlflow_data:
